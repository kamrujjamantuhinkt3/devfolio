<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="KT">
  <defs>
    <linearGradient id="kt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#kt)"/>

  <!-- KT drawn as paths, not text: no system font needed, so it renders
       identically everywhere and stays legible down to 16px -->
  <g fill="none" stroke="#ffffff" stroke-width="5.5"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 20 L15 44"/>
    <path d="M15 32 L26 20"/>
    <path d="M15 32 L27 44"/>
    <path d="M33 20 L49 20"/>
    <path d="M41 20 L41 44"/>
  </g>
</svg>
